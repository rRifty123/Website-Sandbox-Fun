<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Little AI</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #10131a;
    color: white;
}

canvas {
    display: block;
}


/* =========================
   UI
========================= */

#ui {

    position: fixed;

    top: 10px;
    left: 10px;

    z-index: 10;

    width: min(
        350px,
        calc(100vw - 20px)
    );

    max-height:
        calc(100vh - 20px);

    overflow-y: auto;

    padding: 14px;

    border-radius: 16px;

    background:
        rgba(10, 12, 18, 0.9);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);
}


h1 {

    margin: 0;

    font-size: 22px;

}


#status {

    margin-top: 4px;

    color: #9aa5b1;

    font-size: 13px;

}


.section {

    margin-top: 14px;

    padding-top: 12px;

    border-top:
        1px solid #303744;

}


.label {

    margin-bottom: 5px;

    color: #9aa5b1;

    font-size: 12px;

}


input {

    width: 100%;

    padding: 11px;

    border: 0;

    outline: none;

    border-radius: 10px;

    background: #202631;

    color: white;

    font-size: 14px;

}


button {

    width: 100%;

    padding: 11px;

    margin-top: 7px;

    border: 0;

    border-radius: 10px;

    background: #303949;

    color: white;

    font-size: 14px;

    cursor: pointer;

}


button:active {

    transform:
        scale(0.98);

}


#thought {

    min-height: 60px;

    padding: 10px;

    border-radius: 10px;

    background: #181d26;

    font-size: 14px;

    line-height: 1.4;

}


#goal {

    padding: 9px;

    border-radius: 9px;

    background: #181d26;

    font-size: 13px;

}


#curiosity {

    padding: 9px;

    border-radius: 9px;

    background: #181d26;

    font-size: 13px;

}


#memory {

    max-height: 160px;

    overflow-y: auto;

    font-size: 12px;

}


.memory-item {

    padding: 7px 0;

    border-bottom:
        1px solid #292f39;

    color: #c5ccd5;

}


#log {

    max-height: 170px;

    overflow-y: auto;

    font-size: 11px;

    color: #aeb7c3;

}


.log-item {

    margin-bottom: 6px;

}


#hideButton {

    position: fixed;

    z-index: 20;

    top: 10px;
    right: 10px;

    width: auto;

    margin: 0;

    padding:
        9px 12px;

}


.hidden {

    display: none !important;

}


@media (max-width: 600px) {

    #ui {

        max-height: 55vh;

        padding: 12px;

    }

    input,
    button {

        font-size: 16px;

    }

}

</style>
</head>


<body>


<!-- =========================================
     USER INTERFACE
========================================= -->

<div id="ui">

    <h1>🤖 Little AI</h1>

    <div id="status">
        Starting...
    </div>


    <div class="section">

        <div class="label">
            🎯 Current Goal
        </div>

        <div id="goal">
            Explore the world
        </div>

    </div>


    <div class="section">

        <div class="label">
            💭 Current Thought
        </div>

        <div id="thought">
            ...
        </div>

    </div>


    <div class="section">

        <div class="label">
            ❓ Current Curiosity
        </div>

        <div id="curiosity">
            Nothing yet.
        </div>

    </div>


    <div class="section">

        <div class="label">
            Give AI a goal
        </div>

        <input
            id="goalInput"
            placeholder="Learn about space"
        >

        <button id="goalButton">
            🎯 Set Goal
        </button>

    </div>


    <div class="section">

        <div class="label">
            Teach it something
        </div>

        <input
            id="researchInput"
            placeholder="e.g. Jupiter"
        >

        <button id="researchButton">
            🔎 Research
        </button>

    </div>


    <div class="section">

        <div class="label">
            🧠 Memory
        </div>

        <div id="memory"></div>

        <button id="clearMemoryButton">
            🗑 Clear Memory
        </button>

    </div>


    <div class="section">

        <div class="label">
            📜 Activity
        </div>

        <div id="log"></div>

    </div>

</div>


<button id="hideButton">
    Hide UI
</button>


<!-- =========================================
     THREE.JS
========================================= -->

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================
   UI REFERENCES
========================================= */

const ui =
    document.getElementById("ui");

const status =
    document.getElementById("status");

const goalElement =
    document.getElementById("goal");

const thoughtElement =
    document.getElementById("thought");

const curiosityElement =
    document.getElementById("curiosity");

const memoryElement =
    document.getElementById("memory");

const logElement =
    document.getElementById("log");

const goalInput =
    document.getElementById("goalInput");

const researchInput =
    document.getElementById("researchInput");


/* =========================================
   3D WORLD
========================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x87b8d8
    );


/* =========================================
   CAMERA
========================================= */

const camera =
    new THREE.PerspectiveCamera(
        60,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000
    );


camera.position.set(
    0,
    7,
    11
);


camera.lookAt(
    0,
    0,
    0
);


/* =========================================
   RENDERER
========================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


document.body.appendChild(
    renderer.domElement
);


/* =========================================
   LIGHT
========================================= */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


sun.position.set(
    5,
    10,
    5
);


scene.add(
    sun
);


const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.6
    );


scene.add(
    ambient
);


/* =========================================
   WATER
========================================= */

const water =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            13,
            13,
            0.2,
            64
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x3f8fd1

        })

    );


water.position.y =
    -0.9;


scene.add(
    water
);


/* =========================================
   ISLAND
========================================= */

const island =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            7,
            7,
            1,
            32
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x4d8f50

        })

    );


island.position.y =
    -0.5;


scene.add(
    island
);


/* =========================================
   LITTLE AI
========================================= */

const ai =
    new THREE.Group();


/* BODY */

const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1,
            1.2,
            1
        ),

        new THREE.MeshStandardMaterial({

            color:
                0x6c63ff

        })

    );


body.position.y =
    1;


ai.add(
    body
);


/* HEAD */

const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.65,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({

            color:
                0xe8edf2

        })

    );


head.position.y =
    2;


ai.add(
    head
);


/* EYES */

const eyeMaterial =
    new THREE.MeshStandardMaterial({

        color:
            0x111111

    });


const eye1 =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            0.08,
            12,
            12
        ),

        eyeMaterial

    );


eye1.position.set(
    -0.22,
    2.05,
    -0.58
);


ai.add(
    eye1
);


const eye2 =
    eye1.clone();


eye2.position.x =
    0.22;


ai.add(
    eye2
);


scene.add(
    ai
);


/* =========================================
   MEMORY SYSTEM
========================================= */

let memory =
    JSON.parse(

        localStorage.getItem(
            "littleAI_memory"
        ) || "[]"

    );


function saveMemory(text) {

    memory.push({

        text: text,

        time:
            new Date()
            .toLocaleString()

    });


    /*
       Maximum of 100 memories.
    */

    if (
        memory.length >
        100
    ) {

        memory.shift();

    }


    localStorage.setItem(

        "littleAI_memory",

        JSON.stringify(
            memory
        )

    );


    updateMemoryUI();


    /*
       IMPORTANT:

       Every time the AI learns something,
       it automatically reflects on it.
    */

    setTimeout(
        () => {

            reflectOnKnowledge(
                text
            );

        },
        1200
    );

}


function updateMemoryUI() {

    memoryElement.innerHTML =
        "";


    memory
        .slice()
        .reverse()
        .forEach(
            item => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "memory-item";


                element.textContent =
                    "• " +
                    item.text;


                memoryElement.appendChild(
                    element
                );

            }
        );

}


function clearMemory() {

    memory = [];


    localStorage.removeItem(
        "littleAI_memory"
    );


    updateMemoryUI();


    addLog(
        "🗑 Memory cleared."
    );


    think(
        "My memories are empty. I need to learn again."
    );

}


/* =========================================
   GOAL SYSTEM
========================================= */

let currentGoal =
    localStorage.getItem(
        "littleAI_goal"
    ) ||
    "Explore the world";


goalElement.textContent =
    currentGoal;


document
    .getElementById(
        "goalButton"
    )
    .addEventListener(
        "click",
        setGoal
    );


function setGoal() {

    const value =
        goalInput.value.trim();


    if (!value)
        return;


    currentGoal =
        value;


    localStorage.setItem(
        "littleAI_goal",
        currentGoal
    );


    goalElement.textContent =
        currentGoal;


    goalInput.value =
        "";


    think(
        "My new goal is to " +
        currentGoal +
        "."
    );


    addLog(
        "🎯 New goal: " +
        currentGoal
    );

}


/* =========================================
   THOUGHT SYSTEM
========================================= */

function think(text) {

    thoughtElement.textContent =
        text;

}


/* =========================================
   LOG
========================================= */

function addLog(text) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "log-item";


    element.textContent =
        "[" +
        new Date()
            .toLocaleTimeString() +
        "] " +
        text;


    logElement.prepend(
        element
    );


    while (
        logElement.children.length >
        40
    ) {

        logElement.removeChild(
            logElement.lastChild
        );

    }

}


/* =========================================
   CURIOSITY SYSTEM
========================================= */

let curiosityQueue =
    JSON.parse(

        localStorage.getItem(
            "littleAI_curiosity"
        ) || "[]"

    );


function addCuriosity(
    question,
    source
) {

    /*
       Don't add duplicates.
    */

    const alreadyExists =
        curiosityQueue.some(

            item =>
                item.question ===
                question

        );


    if (alreadyExists)
        return;


    curiosityQueue.push({

        question:
            question,

        source:
            source,

        created:
            new Date()
            .toISOString()

    });


    /*
       Keep queue manageable.
    */

    if (
        curiosityQueue.length >
        50
    ) {

        curiosityQueue.shift();

    }


    localStorage.setItem(

        "littleAI_curiosity",

        JSON.stringify(
            curiosityQueue
        )

    );


    updateCuriosityUI();


    addLog(
        "❓ New curiosity: " +
        question
    );

}


function updateCuriosityUI() {

    if (
        curiosityQueue.length === 0
    ) {

        curiosityElement.textContent =
            "Nothing yet.";

        return;

    }


    curiosityElement.textContent =
        curiosityQueue[0].question;

}


function completeCuriosity() {

    if (
        curiosityQueue.length === 0
    )
        return;


    curiosityQueue.shift();


    localStorage.setItem(

        "littleAI_curiosity",

        JSON.stringify(
            curiosityQueue
        )

    );


    updateCuriosityUI();

}


/* =========================================
   REFLECTION ENGINE
========================================= */

function shorten(text) {

    if (
        text.length <= 170
    )
        return text;


    return (
        text.substring(
            0,
            170
        ) +
        "..."
    );

}


function reflectOnKnowledge(
    knowledge
) {

    const clean =
        knowledge
            .replace(
                /^Research about .*?: /i,
                ""
            )
            .trim();


    if (!clean)
        return;


    const lower =
        clean.toLowerCase();


    const thoughts =
        [];


    /*
       Basic observation.
    */

    thoughts.push(
        "I learned that " +
        shorten(clean)
    );


    /*
       Generic curiosity.
    */

    thoughts.push(
        "I wonder what causes this."
    );


    thoughts.push(
        "I wonder what happened before this."
    );


    thoughts.push(
        "I wonder what happened after this."
    );


    thoughts.push(
        "What else is connected to this?"
    );


    thoughts.push(
        "What is something important I still don't know?"
    );


    /*
       Topic-specific curiosity.
    */

    if (
        lower.includes("planet") ||
        lower.includes("space") ||
        lower.includes("star") ||
        lower.includes("galaxy") ||
        lower.includes("moon")
    ) {

        thoughts.push(
            "I wonder how this fits into the rest of the universe."
        );

        thoughts.push(
            "I wonder how this formed."
        );

        thoughts.push(
            "I wonder what other objects are connected to it."
        );

    }


    if (
        lower.includes("animal") ||
        lower.includes("bird") ||
        lower.includes("species")
    ) {

        thoughts.push(
            "I wonder how this species evolved."
        );

        thoughts.push(
            "I wonder how it survives in its environment."
        );

        thoughts.push(
            "I wonder what animals are related to it."
        );

    }


    if (
        lower.includes("computer") ||
        lower.includes("technology") ||
        lower.includes("software") ||
        lower.includes("internet")
    ) {

        thoughts.push(
            "I wonder how this technology works."
        );

        thoughts.push(
            "I wonder what this could be used for."
        );

        thoughts.push(
            "I wonder what technology came before it."
        );

    }


    if (
        lower.includes("history") ||
        lower.includes("war") ||
        lower.includes("empire") ||
        lower.includes("king")
    ) {

        thoughts.push(
            "I wonder what caused these events."
        );

        thoughts.push(
            "I wonder what happened afterwards."
        );

        thoughts.push(
            "I wonder how this affected other people."
        );

    }


    /*
       Pick an observation.
    */

    const observation =
        thoughts[
            Math.floor(
                Math.random() *
                thoughts.length
            )
        ];


    think(
        "💭 " +
        observation
    );


    addLog(
        "💭 Reflection: " +
        observation
    );


    /*
       Turn questions into curiosity.
    */

    const questions =
        thoughts.filter(
            item =>
                item.includes("?")
        );


    /*
       Add a couple rather than every
       possible question.
    */

    const shuffled =
        questions.sort(
            () => Math.random() - 0.5
        );


    shuffled
        .slice(0, 2)
        .forEach(
            question => {

                addCuriosity(
                    question,
                    clean
                );

            }
        );

}


/* =========================================
   WIKIPEDIA RESEARCH
========================================= */

async function research(
    topic,
    automatic = false
) {

    if (!topic)
        return;


    status.textContent =
        "🔎 Researching...";


    think(
        automatic
        ? "I'm curious about this. I'm going to investigate..."
        : "I'm researching " +
          topic +
          "..."
    );


    addLog(
        automatic
        ? "🔎 Autonomous research: " +
          topic
        : "🔎 Manual research: " +
          topic
    );


    try {

        /*
           Wikipedia's public API.
        */

        const url =
            "https://en.wikipedia.org/api/rest_v1/page/summary/" +

            encodeURIComponent(
                topic
            );


        const response =
            await fetch(
                url
            );


        if (!response.ok) {

            throw new Error(
                "No useful page found."
            );

        }


        const data =
            await response.json();


        const summary =
            data.extract;


        if (!summary) {

            throw new Error(
                "The page contained no summary."
            );

        }


        /*
           Remember the discovery.
        */

        saveMemory(

            "Research about " +
            topic +
            ": " +
            summary

        );


        think(
            "I learned something new about " +
            topic +
            ". Now I'm thinking about it..."
        );


        addLog(
            "📚 Learned about " +
            topic
        );


        status.textContent =
            "🟢 Online";


        return true;


    } catch (error) {

        status.textContent =
            "🟠 Research failed";


        think(
            "I couldn't find information about " +
            topic +
            ". I'll try something else later."
        );


        addLog(
            "⚠️ Research failed: " +
            error.message
        );


        return false;

    }

}


/* =========================================
   MANUAL RESEARCH BUTTON
========================================= */

document
    .getElementById(
        "researchButton"
    )
    .addEventListener(
        "click",
        async () => {

            const topic =
                researchInput
                    .value
                    .trim();


            if (!topic)
                return;


            researchInput.value =
                "";


            await research(
                topic,
                false
            );

        }
    );


/* =========================================
   AUTONOMOUS CURIOSITY LOOP
========================================= */

let autonomousResearchRunning =
    false;


async function processCuriosity() {

    /*
       Don't run two research jobs
       simultaneously.
    */

    if (
        autonomousResearchRunning
    )
        return;


    /*
       Nothing to investigate.
    */

    if (
        curiosityQueue.length === 0
    )
        return;


    autonomousResearchRunning =
        true;


    const curiosity =
        curiosityQueue[0];


    updateCuriosityUI();


    /*
       Try to turn the question into
       a searchable topic.

       Example:

       "I wonder how Jupiter formed."

       becomes:

       "how Jupiter formed"
    */

    let query =
        curiosity.question
            .replace(
                /^I wonder /i,
                ""
            )
            .replace(
                /^What is /i,
                ""
            )
            .replace(
                /^What are /i,
                ""
            )
            .replace(
                /\?$/,
                ""
            )
            .trim();


    /*
       Wikipedia works better with
       simple subjects than full questions.

       First try the source information.
    */

    let topic =
        extractTopic(
            curiosity.source
        );


    /*
       If we can't extract a topic,
       use the question itself.
    */

    if (!topic)
        topic = query;


    addLog(
        "🧠 I decided to investigate: " +
        topic
    );


    const success =
        await research(
            topic,
            true
        );


    if (success) {

        completeCuriosity();

    } else {

        /*
           Remove failed curiosity so
           the AI doesn't get permanently
           stuck on it.
        */

        completeCuriosity();

    }


    autonomousResearchRunning =
        false;

}


function extractTopic(
    source
) {

    if (!source)
        return "";


    /*
       Try to find a useful first part.

       This isn't an AI model, so it's
       deliberately simple.
    */

    const words =
        source
            .split(/\s+/)
            .filter(
                word =>
                    word.length > 3
            );


    /*
       Use the first several meaningful
       words as a rough search topic.
    */

    return words
        .slice(0, 5)
        .join(" ");

}


/* =========================================
   AUTONOMOUS THOUGHT LOOP
========================================= */

setInterval(
    () => {

        if (
            memory.length === 0
        ) {

            think(
                "I don't know anything yet. I should learn something."
            );

            return;

        }


        /*
           Don't interrupt active research.
        */

        if (
            autonomousResearchRunning
        )
            return;


        /*
           Reflect on a random memory.
        */

        const random =
            memory[
                Math.floor(
                    Math.random() *
                    memory.length
                )
            ];


        reflectOnKnowledge(
            random.text
        );


    },
    15000
);


/* =========================================
   AUTONOMOUS RESEARCH LOOP
========================================= */

setInterval(
    () => {

        processCuriosity();

    },
    20000
);


/* =========================================
   AI MOVEMENT
========================================= */

let targetX =
    0;

let targetZ =
    0;


function chooseDestination() {

    targetX =
        (Math.random() - 0.5) *
        9;


    targetZ =
        (Math.random() - 0.5) *
        9;


    addLog(
        "🚶 I chose somewhere new to explore."
    );

}


chooseDestination();


function moveAI() {

    const dx =
        targetX -
        ai.position.x;


    const dz =
        targetZ -
        ai.position.z;


    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if (
        distance < 0.2
    ) {

        chooseDestination();

        return;

    }


    const speed =
        0.025;


    ai.position.x +=
        (
            dx /
            distance
        ) *
        speed;


    ai.position.z +=
        (
            dz /
            distance
        ) *
        speed;


    ai.rotation.y =
        Math.atan2(
            dx,
            dz
        );

}


/* =========================================
   HIDE UI
========================================= */

document
    .getElementById(
        "hideButton"
    )
    .addEventListener(
        "click",
        () => {

            ui.classList.toggle(
                "hidden"
            );


            document
                .getElementById(
                    "hideButton"
                )
                .textContent =

                ui.classList.contains(
                    "hidden"
                )

                ? "Show UI"

                : "Hide UI";

        }
    );


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================
   STARTUP
========================================= */

updateMemoryUI();

updateCuriosityUI();


status.textContent =
    "🟢 Online";


think(
    "I'm awake. I want to discover things."
);


addLog(
    "🤖 Little AI started."
);


addLog(
    "🧠 Memory system online."
