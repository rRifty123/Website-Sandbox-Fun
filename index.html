<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Little AI</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* ---------------- UI ---------------- */

#ui {
    position: fixed;
    z-index: 10;

    top: 10px;
    left: 10px;

    width: min(340px, calc(100vw - 20px));
    max-height: calc(100vh - 20px);

    overflow-y: auto;

    padding: 14px;

    border-radius: 16px;

    background: rgba(10, 12, 18, 0.88);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

h1 {
    margin: 0;
    font-size: 22px;
}

#status {
    margin-top: 4px;
    color: #9aa5b1;
    font-size: 13px;
}

.section {
    margin-top: 14px;
    padding-top: 12px;

    border-top: 1px solid #303744;
}

.label {
    margin-bottom: 5px;

    color: #9aa5b1;
    font-size: 12px;
}

input {
    width: 100%;

    padding: 11px;

    border: 0;
    outline: none;

    border-radius: 10px;

    background: #202631;
    color: white;

    font-size: 14px;
}

button {
    width: 100%;

    padding: 11px;
    margin-top: 7px;

    border: 0;
    border-radius: 10px;

    background: #303949;
    color: white;

    font-size: 14px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(0.98);
}

#thought {
    min-height: 55px;

    padding: 10px;

    border-radius: 10px;

    background: #181d26;

    font-size: 14px;
    line-height: 1.4;
}

#goal {
    padding: 8px;

    border-radius: 8px;

    background: #181d26;

    font-size: 13px;
}

#memory {
    max-height: 130px;

    overflow-y: auto;

    font-size: 12px;
}

.memory-item {
    padding: 6px 0;

    border-bottom: 1px solid #292f39;

    color: #c5ccd5;
}

#log {
    max-height: 150px;

    overflow-y: auto;

    font-size: 11px;

    color: #aeb7c3;
}

.log-item {
    margin-bottom: 6px;
}

#hideButton {
    position: fixed;

    z-index: 20;

    top: 10px;
    right: 10px;

    width: auto;

    padding: 9px 12px;

    margin: 0;
}

.hidden {
    display: none !important;
}

/* Mobile */

@media (max-width: 600px) {

    #ui {
        width: calc(100vw - 20px);
        max-height: 55vh;

        padding: 12px;
    }

    h1 {
        font-size: 19px;
    }

    button,
    input {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<!-- ==============================
     INTERFACE
================================ -->

<div id="ui">

    <h1>🤖 Little AI</h1>

    <div id="status">
        Starting AI...
    </div>


    <div class="section">

        <div class="label">
            Current goal
        </div>

        <div id="goal">
            Explore the world
        </div>

    </div>


    <div class="section">

        <div class="label">
            Current thought
        </div>

        <div id="thought">
            ...
        </div>

    </div>


    <div class="section">

        <div class="label">
            Give AI a goal
        </div>

        <input
            id="goalInput"
            placeholder="Learn about space"
        >

        <button id="goalButton">
            🎯 Set Goal
        </button>

    </div>


    <div class="section">

        <div class="label">
            Research something
        </div>

        <input
            id="researchInput"
            placeholder="e.g. Jupiter"
        >

        <button id="researchButton">
            🔎 Research
        </button>

    </div>


    <div class="section">

        <div class="label">
            Memory
        </div>

        <div id="memory"></div>

        <button id="clearMemoryButton">
            🗑 Clear Memory
        </button>

    </div>


    <div class="section">

        <div class="label">
            Activity
        </div>

        <div id="log"></div>

    </div>

</div>


<button id="hideButton">
    Hide UI
</button>


<!--
=========================================================
THREE.JS

IMPORTANT:
We are NOT using:

    THREE.Scene()

from a normal script.

Instead we import Three.js as an ES module below.
=========================================================
-->

<script type="module">

import * as THREE
    from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   UI REFERENCES
===================================================== */

const ui =
    document.getElementById("ui");

const status =
    document.getElementById("status");

const goalElement =
    document.getElementById("goal");

const thoughtElement =
    document.getElementById("thought");

const memoryElement =
    document.getElementById("memory");

const logElement =
    document.getElementById("log");

const goalInput =
    document.getElementById("goalInput");

const researchInput =
    document.getElementById("researchInput");


/* =====================================================
   3D SCENE
===================================================== */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x87b8d8);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    7,
    11
);


camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


sunlight.position.set(
    5,
    10,
    5
);


scene.add(
    sunlight
);


const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.6
    );


scene.add(
    ambientLight
);


/* =====================================================
   WATER
===================================================== */

const waterGeometry =
    new THREE.CylinderGeometry(
        13,
        13,
        0.2,
        64
    );


const waterMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3f8fd1
    });


const water =
    new THREE.Mesh(
        waterGeometry,
        waterMaterial
    );


water.position.y =
    -0.9;


scene.add(
    water
);


/* =====================================================
   ISLAND
===================================================== */

const islandGeometry =
    new THREE.CylinderGeometry(
        7,
        7,
        1,
        32
    );


const islandMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4d8f50
    });


const island =
    new THREE.Mesh(
        islandGeometry,
        islandMaterial
    );


island.position.y =
    -0.5;


scene.add(
    island
);


/* =====================================================
   AI CHARACTER
===================================================== */

const ai =
    new THREE.Group();


/* BODY */

const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            1.2,
            1
        ),

        new THREE.MeshStandardMaterial({
            color: 0x6c63ff
        })
    );


body.position.y =
    1;


ai.add(
    body
);


/* HEAD */

const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.65,
            24,
            24
        ),

        new THREE.MeshStandardMaterial({
            color: 0xe8edf2
        })
    );


head.position.y =
    2;


ai.add(
    head
);


/* EYES */

const eyeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x111111
    });


const eye1 =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            0.08,
            12,
            12
        ),

        eyeMaterial
    );


eye1.position.set(
    -0.22,
    2.05,
    -0.58
);


ai.add(
    eye1
);


const eye2 =
    eye1.clone();


eye2.position.x =
    0.22;


ai.add(
    eye2
);


/* ADD AI */

ai.position.set(
    0,
    0,
    0
);


scene.add(
    ai
);


/* =====================================================
   MEMORY
===================================================== */

let memory =
    JSON.parse(
        localStorage.getItem(
            "littleAI_memory"
        ) || "[]"
    );


function saveMemory(text) {

    memory.push({

        text: text,

        time:
            new Date()
            .toLocaleString()

    });


    if (memory.length > 100) {

        memory.shift();

    }


    localStorage.setItem(
        "littleAI_memory",
        JSON.stringify(memory)
    );


    updateMemoryUI();
}


function updateMemoryUI() {

    memoryElement.innerHTML =
        "";


    memory
        .slice()
        .reverse()
        .forEach(item => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "memory-item";


            element.textContent =
                "• " +
                item.text;


            memoryElement.appendChild(
                element
            );

        });
}


/* =====================================================
   CLEAR MEMORY
===================================================== */

document
    .getElementById(
        "clearMemoryButton"
    )
    .addEventListener(
        "click",
        () => {

            memory = [];

            localStorage.removeItem(
                "littleAI_memory"
            );

            updateMemoryUI();

            addLog(
                "Memory cleared."
            );

        }
    );


/* =====================================================
   GOALS
===================================================== */

let currentGoal =
    localStorage.getItem(
        "littleAI_goal"
    ) ||
    "Explore the world";


goalElement.textContent =
    currentGoal;


document
    .getElementById(
        "goalButton"
    )
    .addEventListener(
        "click",
        setGoal
    );


function setGoal() {

    const value =
        goalInput
            .value
            .trim();


    if (!value)
        return;


    currentGoal =
        value;


    localStorage.setItem(
        "littleAI_goal",
        currentGoal
    );


    goalElement.textContent =
        currentGoal;


    goalInput.value =
        "";


    think(
        "My goal is now: " +
        currentGoal
    );


    addLog(
        "New goal: " +
        currentGoal
    );

}


/* =====================================================
   THOUGHT SYSTEM
===================================================== */

const thoughts = [

    "I wonder what is around here.",

    "I should explore somewhere new.",

    "What could I learn today?",

    "I wonder what is beyond the island.",

    "I should remember what I discover.",

    "Maybe I should investigate something interesting.",

    "I wonder how my world works.",

    "There might be something new to discover."

];


function think(text) {

    thoughtElement.textContent =
        text;

}


function randomThought() {

    const thought =
        thoughts[
            Math.floor(
                Math.random() *
                thoughts.length
            )
        ];


    think(
        thought
    );


    addLog(
        "Thought: " +
        thought
    );

}


/* =====================================================
   ACTIVITY LOG
===================================================== */

function addLog(text) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "log-item";


    element.textContent =
        "[" +
        new Date()
            .toLocaleTimeString() +
        "] " +
        text;


    logElement.prepend(
        element
    );


    while (
        logElement.children.length >
        30
    ) {

        logElement.removeChild(
            logElement.lastChild
        );

    }

}


/* =====================================================
   AUTONOMOUS MOVEMENT
===================================================== */

let targetX =
    0;

let targetZ =
    0;


function chooseDestination() {

    targetX =
        (Math.random() - 0.5) * 9;


    targetZ =
        (Math.random() - 0.5) * 9;


    addLog(
        "I chose a new place to explore."
    );

}


chooseDestination();


function moveAI() {

    const dx =
        targetX -
        ai.position.x;


    const dz =
        targetZ -
        ai.position.z;


    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if (
        distance <
        0.2
    ) {

        chooseDestination();

        randomThought();

        return;

    }


    const speed =
        0.025;


    ai.position.x +=
        (dx / distance) *
        speed;


    ai.position.z +=
        (dz / distance) *
        speed;


    ai.rotation.y =
        Math.atan2(
            dx,
            dz
        );

}


/* =====================================================
   INTERNET RESEARCH
===================================================== */

/*
   This uses Wikipedia's public REST API.

   It does NOT require an AI API key.
*/

document
    .getElementById(
        "researchButton"
    )
    .addEventListener(
        "click",
        research
    );


async function research() {

    const topic =
        researchInput
            .value
            .trim();


    if (!topic)
        return;


    status.textContent =
        "🔎 Researching...";


    think(
        "I'm researching " +
        topic +
        "..."
    );


    addLog(
        "Started researching: " +
        topic
    );


    try {

        const url =
            "https://en.wikipedia.org/api/rest_v1/page/summary/" +
            encodeURIComponent(
                topic
            );


        const response =
            await fetch(
                url
            );


        if (!response.ok) {

            throw new Error(
                "Could not find that page."
            );

        }


        const data =
            await response.json();


        const summary =
            data.extract ||
            "I didn't find a useful summary.";


        /*
           Save information.
        */

        saveMemory(
            "Research about " +
            topic +
            ": " +
            summary
        );


        think(
            "I learned something about " +
            topic +
            " and remembered it."
        );


        addLog(
            "Learned about " +
            topic
        );


        status.textContent =
            "🟢 Online";


        researchInput.value =
            "";


    } catch (error) {

        status.textContent =
            "🟠 Research failed";


        think(
            "I couldn't access that information."
        );


        addLog(
            "Research error: " +
            error.message
        );

    }

}


/* =====================================================
   HIDE UI
===================================================== */

document
    .getElementById(
        "hideButton"
    )
    .addEventListener(
        "click",
        () => {

            ui.classList.toggle(
                "hidden"
            );


            document
                .getElementById(
                    "hideButton"
                )
                .textContent =
                ui.classList.contains(
                    "hidden"
                )
                ? "Show UI"
                : "Hide UI";

        }
    );


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   STARTUP
===================================================== */

updateMemoryUI();


addLog(
    "Little AI started."
);


think(
    "I'm awake. What should I discover?"
);


status.textContent =
    "🟢 Online";


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    moveAI();


    /*
       Floating animation
    */

    ai.position.y =
        Math.sin(
            Date.now() *
            0.003
        ) *
        0.08;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   PERIODIC THOUGHTS
===================================================== */

setInterval(
    () => {

        randomThought();

    },
    7000
);

</script>

</body>
</html>
