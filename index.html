<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid Dream</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #080b1f, #1a1240);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 25px;
            backdrop-filter: blur(15px);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .moon {
            font-size: 55px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        textarea,
        input {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row div {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #startButton {
            background: white;
            color: #17112f;
        }

        #stopButton {
            display: none;
            background: #ff5c5c;
            color: white;
        }

        #status {
            text-align: center;
            margin-top: 18px;
            min-height: 25px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <main class="app">

        <div class="moon">🌙</div>
        <h1>Lucid Dream</h1>

        <label for="message">Dream message</label>
        <textarea id="message">This is a dream. You're in control.</textarea>

        <div class="row">

            <div>
                <label for="delay">Start after (minutes)</label>
                <input
                    type="number"
                    id="delay"
                    value="90"
                    min="1"
                >
            </div>

            <div>
                <label for="interval">Repeat every (minutes)</label>
                <input
                    type="number"
                    id="interval"
                    value="30"
                    min="1"
                >
            </div>

        </div>

        <label for="repeats">Number of messages</label>
        <input
            type="number"
            id="repeats"
            value="3"
            min="1"
        >

        <button id="startButton">START SLEEP SESSION</button>
        <button id="stopButton">STOP SESSION</button>

        <div id="status">Ready to start 🌙</div>

    </main>

    <script>

        let startTimeout;
        let repeatTimer;
        let messageCount = 0;
        let maxMessages = 0;

        const startButton = document.getElementById("startButton");
        const stopButton = document.getElementById("stopButton");
        const status = document.getElementById("status");

        function speakMessage() {

            const text = document.getElementById("message").value;

            // Stop anything already being spoken
            speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(text);

            // Adjust these later if you want
            speech.volume = 0.7;
            speech.rate = 0.8;
            speech.pitch = 0.9;

            speechSynthesis.speak(speech);

            messageCount++;

            status.textContent =
                "Dream cue " + messageCount + " of " + maxMessages;

            // Stop after the chosen number of cues
            if (messageCount >= maxMessages) {
                clearInterval(repeatTimer);

                setTimeout(() => {
                    status.textContent = "Sleep session complete 🌙";
                    stopButton.style.display = "none";
                    startButton.style.display = "block";
                }, 3000);
            }
        }

        startButton.addEventListener("click", () => {

            const delayMinutes =
                Number(document.getElementById("delay").value);

            const intervalMinutes =
                Number(document.getElementById("interval").value);

            maxMessages =
                Number(document.getElementById("repeats").value);

            messageCount = 0;

            const delayMilliseconds =
                delayMinutes * 60 * 1000;

            const intervalMilliseconds =
                intervalMinutes * 60 * 1000;

            startButton.style.display = "none";
            stopButton.style.display = "block";

            status.textContent =
                "Session started. First cue in " +
                delayMinutes + " minutes.";

            // Wait for the initial delay
            startTimeout = setTimeout(() => {

                speakMessage();

                // Repeat after the chosen interval
                repeatTimer = setInterval(() => {

                    if (messageCount < maxMessages) {
                        speakMessage();
                    }

                }, intervalMilliseconds);

            }, delayMilliseconds);

        });

        stopButton.addEventListener("click", () => {

            clearTimeout(startTimeout);
            clearInterval(repeatTimer);

            speechSynthesis.cancel();

            status.textContent = "Session stopped.";

            stopButton.style.display = "none";
            startButton.style.display = "block";

        });

    </script>

</body>
</html>
