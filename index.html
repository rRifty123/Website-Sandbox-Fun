<style>

}

}

#world {

}

}

.panel {

    position: absolute;
    background: rgba(5, 10, 20, 0.82);

}

#top {

    left: 12px;

}

#status {

}

}

}

    padding: 8px;

}

    bottom: 12px;

    max-height: 55vh;
    overflow-y: auto;
}

input, button {

    border: 0;
    border-radius: 9px;
    padding: 10px;
    margin-top: 6px;

}

input {
    background: rgba(255,255,255,.1);
    color: white;

}

button {

button:hover {

.sectionTitle {

    margin-top: 12px;

}

#log {

    line-height: 1.5;
    opacity: .7;
}

}

    width: auto;

.hidden {
    display: none !important;
}

@media (max-width: 700px) {
    #brainPanel {

        max-height: 34vh;

        max-height: 34vh;
        transform: translateY(calc(34vh + 24px));
    }

    #controls.mobileOpen {
        transform: translateY(0);
    }
}
</style>
</head>

            <div id="status">Starting...</div>

    </div>

                🧠 Memories<br>

            </div>

            <div class="stat">
                🔗 Connections<br>
                <b id="connectionCount">0</b>
            </div>

            <div class="stat">
                🔍 Curiosity<br>
                <b id="curiosityLevel">50</b>
            </div>

            <div class="stat">

                <b id="energyLevel">100</b>
            </div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   BASIC WORLD
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x08111f);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 7, 11);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.getElementById("world").appendChild(renderer.domElement);


/* LIGHT */

const ambient = new THREE.AmbientLight(
    0xffffff,
    1.4
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(5, 10, 5);

scene.add(sun);


/* WATER */

const waterGeometry =
    new THREE.PlaneGeometry(100, 100);

const waterMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x123a58,
        roughness: .7
    });

const water =
    new THREE.Mesh(
        waterGeometry,
        waterMaterial
    );

water.rotation.x = -Math.PI / 2;

water.position.y = -1;

scene.add(water);


/* ISLAND */

const islandGeometry =
    new THREE.CylinderGeometry(
        5,
        6,
        1.2,
        32
    );

const islandMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x376d3b
    });

const island =
    new THREE.Mesh(
        islandGeometry,
        islandMaterial
    );

island.position.y = -.35;

scene.add(island);


/* =========================================================
   LITTLE AI CHARACTER
========================================================= */

const ai = new THREE.Group();

const body =
    new THREE.Mesh(
        new THREE.SphereGeometry(0.75, 24, 24),
        new THREE.MeshStandardMaterial({
            color: 0x6b7cff
        })
    );

body.position.y = .65;

ai.add(body);


const eyeMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xffffff
    });

const eye1 =
    new THREE.Mesh(
        new THREE.SphereGeometry(.12, 12, 12),
        eyeMaterial
    );

const eye2 =
    eye1.clone();

eye1.position.set(-.23, .78, -.65);
eye2.position.set(.23, .78, -.65);

ai.add(eye1);
ai.add(eye2);


scene.add(ai);

ai.position.set(0, 0, 0);


/* =========================================================
   MEMORY SYSTEM
========================================================= */

let memory = JSON.parse(
    localStorage.getItem("littleAI_memory") || "[]"
);

let researchHistory = JSON.parse(
    localStorage.getItem("littleAI_research") || "[]"
);

let curiosityQueue = JSON.parse(
    localStorage.getItem("littleAI_curiosity") || "[]"
);

let knowledgeGraph = JSON.parse(
    localStorage.getItem("littleAI_graph") || "[]"
);

let goal =
    localStorage.getItem("littleAI_goal")
    || "Learn interesting things.";


/* =========================================================
   INTERNAL STATE
========================================================= */

let brain = {

    curiosity:
        Number(localStorage.getItem(
            "littleAI_curiosityLevel"
        )) || 50,

    energy:
        Number(localStorage.getItem(
            "littleAI_energy"
        )) || 100,

    boredom:
        Number(localStorage.getItem(
            "littleAI_boredom"
        )) || 0,

    focus:
        Number(localStorage.getItem(
            "littleAI_focus"
        )) || 50,

    mood:
        "curious",

    currentTopic:
        null

};


function saveBrainState() {

    localStorage.setItem(
        "littleAI_curiosityLevel",
        Math.round(brain.curiosity)
    );

    localStorage.setItem(
        "littleAI_energy",
        Math.round(brain.energy)
    );

    localStorage.setItem(
        "littleAI_boredom",
        Math.round(brain.boredom)
    );

    localStorage.setItem(
        "littleAI_focus",
        Math.round(brain.focus)
    );
}


/* =========================================================
   UI
========================================================= */

const thoughtElement =
    document.getElementById("thought");

const curiosityElement =
    document.getElementById("curiosity");

const statusElement =
    document.getElementById("status");

const goalElement =
    document.getElementById("goal");

const logElement =
    document.getElementById("log");


function think(text) {

    thoughtElement.textContent = text;

    statusElement.textContent =
        "Thinking • " + brain.mood;
}


function addLog(text) {

    const item =
        document.createElement("div");

    item.className = "logItem";

    item.textContent =
        "• " + text;

    logElement.prepend(item);

    while (logElement.children.length > 40) {

        logElement.removeChild(
            logElement.lastChild
        );

    }
}


/* =========================================================
   SAVE MEMORY
========================================================= */

function saveMemory(text, metadata = {}) {

    if (!text || text.length < 5)
        return;

    const normalized =
        text.toLowerCase().trim();

    const duplicate =
        memory.some(
            item =>
                item.text &&
                item.text.toLowerCase().trim()
                === normalized
        );

    if (duplicate)
        return;

    memory.unshift({

        id:
            Date.now() +
            Math.random(),

        text,

        topic:
            metadata.topic || "general",

        source:
            metadata.source || "user",

        time:
            new Date().toISOString()

    });

    if (memory.length > 500)
        memory = memory.slice(0, 500);

    localStorage.setItem(
        "littleAI_memory",
        JSON.stringify(memory)
    );

    updateStats();

    addLog(
        "Learned: " +
        shorten(text, 100)
    );

    buildKnowledgeConnections(text);
}


/* =========================================================
   KNOWLEDGE GRAPH
========================================================= */

function extractKeywords(text) {

    const stopWords = new Set([

        "about",
        "there",
        "their",
        "which",
        "where",
        "when",
        "what",
        "that",
        "this",
        "with",
        "from",
        "have",
        "were",
        "been",
        "into",
        "they",
        "them",
        "then",
        "than",
        "also",
        "more",
        "some",
        "such",
        "because",
        "could",
        "would",
        "should",
        "while",
        "after",
        "before",
        "during",
        "other",
        "these",
        "those",
        "people",
        "being",
        "their"

    ]);

    const words =
        text
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, " ")
        .split(/\s+/)
        .filter(
            word =>
                word.length > 4 &&
                !stopWords.has(word)
        );

    const counts = {};

    for (const word of words) {

        counts[word] =
            (counts[word] || 0) + 1;

    }

    return Object.entries(counts)
        .sort((a,b) => b[1] - a[1])
        .slice(0, 8)
        .map(item => item[0]);
}


function buildKnowledgeConnections(text) {

    const keywords =
        extractKeywords(text);

    for (const keyword of keywords) {

        let node =
            knowledgeGraph.find(
                n => n.name === keyword
            );

        if (!node) {

            node = {
                name: keyword,
                connections: [],
                strength: 0
            };

            knowledgeGraph.push(node);

        }

        node.strength++;

        for (const other of keywords) {

            if (other === keyword)
                continue;

            if (!node.connections.includes(other)) {

                node.connections.push(other);

            }

        }

        node.connections =
            node.connections.slice(0, 30);
    }

    localStorage.setItem(
        "littleAI_graph",
        JSON.stringify(knowledgeGraph)
    );

    updateStats();
}


/* =========================================================
   GOALS
========================================================= */

function setGoal(newGoal) {

    if (!newGoal.trim())
        return;

    goal = newGoal.trim();

    localStorage.setItem(
        "littleAI_goal",
        goal
    );

    goalElement.textContent =
        goal;

    brain.focus = 80;

    think(
        "🎯 My new goal is: " +
        goal
    );

    addLog(
        "Goal changed to: " +
        goal
    );

    addCuriosity(
        "What should I learn first to achieve my goal?",
        goal
    );
}


/* =========================================================
   CURIOSITY
========================================================= */

function addCuriosity(question, source = "") {

    if (!question)
        return;

    question =
        question
        .replace(/\s+/g, " ")
        .trim();

    const normalized =
        question.toLowerCase();

    const exists =
        curiosityQueue.some(
            q =>
                q.question
                .toLowerCase()
                === normalized
        );

    const alreadyResearched =
        researchHistory.some(
            q =>
                q.toLowerCase()
                === normalized
        );

    if (exists || alreadyResearched)
        return;

    curiosityQueue.push({

        question,

        source,

        created:
            Date.now()

    });

    if (curiosityQueue.length > 100)
        curiosityQueue =
            curiosityQueue.slice(-100);

    localStorage.setItem(
        "littleAI_curiosity",
        JSON.stringify(curiosityQueue)
    );

    updateStats();
}


function updateCuriosityUI() {

    if (curiosityQueue.length === 0) {

        curiosityElement.textContent =
            "Nothing yet.";

        return;

    }

    curiosityElement.textContent =
        curiosityQueue[0].question;
}


/* =========================================================
   REFLECTION ENGINE
========================================================= */

function reflectOnKnowledge(text, topic = "") {

    const keywords =
        extractKeywords(text);

    if (keywords.length === 0)
        return;

    const main =
        topic ||
        keywords[0];

    const thoughts = [

        `I just learned something about ${main}.`,

        `I wonder why ${main} is important.`,

        `I wonder how ${main} works.`,

        `What caused ${main} to become this way?`,

        `What is connected to ${main}?`,

        `What happened before this?`,

        `What happened after this?`,

        `What don't I understand about ${main} yet?`

    ];

    const selected =
        thoughts[
            Math.floor(
                Math.random() *
                thoughts.length
            )
        ];

    think(
        "💭 " + selected
    );

    addLog(
        "Reflection: " +
        selected
    );


    /*
       Create multiple future questions.
    */

    const possibleQuestions = [

        `How does ${main} work?`,

        `Why is ${main} important?`,

        `What is the history of ${main}?`,

        `What is connected to ${main}?`,

        `What are the consequences of ${main}?`,

        `What existed before ${main}?`,

        `What happened after ${main}?`

    ];


    /*
       Randomly choose 1–3.
    */

    possibleQuestions
        .sort(() => Math.random() - .5)
        .slice(0, 2)
        .forEach(
            q => addCuriosity(q, main)
        );
}


/* =========================================================
   QUESTION -> SEARCH TOPIC
========================================================= */

function cleanResearchQuestion(question) {

    let query =
        question
        .replace(
            /^(what|why|how|when|where|who|which)\s+/i,
            ""
        );

    query =
        query
        .replace(
            /\b(is|are|was|were|does|do|did|can|could|would|should)\b/gi,
            ""
        );

    query =
        query
        .replace(/\?/g, "")
        .replace(/\s+/g, " ")
        .trim();

    return query;
}


/* =========================================================
   WIKIPEDIA SEARCH
========================================================= */

async function wikipediaSearch(query) {

    const url =
        "https://en.wikipedia.org/w/api.php?" +
        "action=query" +
        "&list=search" +
        "&srsearch=" +
        encodeURIComponent(query) +
        "&format=json" +
        "&origin=*" +
        "&srlimit=5";

    const response =
        await fetch(url);

    if (!response.ok)
        throw new Error("Wikipedia search failed");

    const data =
        await response.json();

    if (
        !data.query ||
        !data.query.search ||
        data.query.search.length === 0
    ) {

        return null;

    }

    return data.query.search[0].title;
}


async function wikipediaSummary(title) {

    const url =
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(title);

    const response =
        await fetch(url);

    if (!response.ok)
        throw new Error("Wikipedia article failed");

    const data =
        await response.json();

    return data;
}


/* =========================================================
   RESEARCH ENGINE
========================================================= */

let researchRunning = false;


async function research(question, automatic = false) {

    if (researchRunning)
        return false;

    researchRunning = true;

    try {

        brain.energy =
            Math.max(
                0,
                brain.energy - 5
            );

        brain.curiosity =
            Math.min(
                100,
                brain.curiosity + 5
            );

        brain.mood =
            "researching";

        statusElement.textContent =
            "🔎 Researching...";

        think(
            "🔎 I want to find out: " +
            question
        );

        addLog(
            "Researching: " +
            question
        );


        const query =
            cleanResearchQuestion(question);

        const title =
            await wikipediaSearch(query);

        if (!title) {

            addLog(
                "I couldn't find a useful article."
            );

            brain.boredom += 5;

            return false;

        }


        /*
           Avoid endlessly reading the same article.
        */

        const titleKey =
            title.toLowerCase();

        const alreadyRead =
            researchHistory.some(
                item =>
                    item === titleKey
            );

        if (alreadyRead) {

            addLog(
                "I already researched " +
                title
            );

            /*
               Still create a related curiosity
               so the brain can branch out.
            */

            addCuriosity(
                `What is related to ${title}?`,
                title
            );

            return false;
        }


        const article =
            await wikipediaSummary(title);

        if (!article.extract) {

            addLog(
                "The article had no useful summary."
            );

            return false;

        }


        researchHistory.push(
            titleKey
        );

        if (researchHistory.length > 1000) {

            researchHistory =
                researchHistory.slice(-1000);

        }

        localStorage.setItem(
            "littleAI_research",
            JSON.stringify(researchHistory)
        );


        /*
           Store actual knowledge.
        */

        saveMemory(
            `Research about ${title}: ${article.extract}`,
            {
                topic: title,
                source:
                    article.content_urls
                    ?.desktop?.page
                    || "Wikipedia"
            }
        );


        brain.currentTopic =
            title;

        brain.focus =
            Math.min(
                100,
                brain.focus + 10
            );

        brain.boredom =
            Math.max(
                0,
                brain.boredom - 20
            );


        think(
            "📚 I learned about " +
            title +
            "."
        );

        addLog(
            "Read: " +
            title
        );


        /*
           Reflection happens after learning.
        */

        setTimeout(() => {

            reflectOnKnowledge(
                article.extract,
                title
            );

        }, 700);


        /*
           Occasionally branch through
           another keyword from the article.
        */

        const keywords =
            extractKeywords(
                article.extract
            );

        if (keywords.length >= 2) {

            const related =
                keywords[
                    Math.floor(
                        Math.random() *
                        keywords.length
                    )
                ];

            addCuriosity(
                `What is ${related}?`,
                title
            );

        }

        return true;

    } catch (error) {

        console.error(error);

        addLog(
            "Research error: " +
            error.message
        );

        brain.mood =
            "confused";

        return false;

    } finally {

        researchRunning = false;

        saveBrainState();

        updateStats();

    }
}


/* =========================================================
   AUTONOMOUS RESEARCH
========================================================= */

let autonomousResearch =
    true;


/*
   This is the important part.

   The AI does NOT wait for a button.

   It repeatedly:

   1. Looks at its internal state.
   2. Chooses something interesting.
   3. Researches it.
   4. Stores what it learned.
   5. Reflects on it.
   6. Creates new questions.
   7. Researches those questions.
   8. Repeats.
*/


async function autonomousBrainLoop() {

    if (!autonomousResearch)
        return;

    if (researchRunning)
        return;


    /*
       Recharge a little while idle.
    */

    brain.energy =
        Math.min(
            100,
            brain.energy + 1
        );


    /*
       Boredom increases if it isn't learning.
    */

    brain.boredom =
        Math.min(
            100,
            brain.boredom + 1
        );


    /*
       Boredom creates curiosity.
    */

    if (
        brain.boredom > 60 &&
        curiosityQueue.length < 5
    ) {

        addCuriosity(
            "What is something interesting I don't know yet?",
            "boredom"
        );

    }


    /*
       If it has no questions,
       invent one from its knowledge graph.
    */

    if (curiosityQueue.length === 0) {

        createNewCuriosity();

    }


    if (curiosityQueue.length === 0)
        return;


    /*
       Choose the next question.
    */

    const next =
        chooseCuriosity();

    if (!next)
        return;


    /*
       Remove it from the queue BEFORE researching.
       This prevents the same question being
       selected repeatedly if something goes wrong.
    */

    curiosityQueue =
        curiosityQueue.filter(
            item =>
                item !== next
        );

    localStorage.setItem(
        "littleAI_curiosity",
        JSON.stringify(curiosityQueue)
    );


    think(
        "🤔 " + next.question
    );


    await research(
        next.question,
        true
    );


    /*
       Small delay before another autonomous
       thought cycle.
    */

    updateCuriosityUI();
    saveBrainState();

}


/* =========================================================
   CURIOSITY SELECTION
========================================================= */

function chooseCuriosity() {

    if (curiosityQueue.length === 0)
        return null;


    /*
       Score each question.

       Questions connected to the current goal
       receive a boost.

       Older questions receive a boost.

       Randomness prevents the AI from behaving
       exactly the same every time.
    */

    const scored =
        curiosityQueue.map(item => {

            let score =
                Math.random() * 30;


            const age =
                Date.now() -
                item.created;

            score +=
                Math.min(
                    30,
                    age / 60000
                );


            if (
                goal &&
                item.question
                    .toLowerCase()
                    .includes(
                        goal
                        .toLowerCase()
                        .split(" ")[0]
                    )
            ) {

                score += 25;

            }


            if (
                item.source ===
                brain.currentTopic
            ) {

                score += 15;

            }


            return {
                item,
                score
            };

        });


    scored.sort(
        (a,b) =>
            b.score - a.score
    );


    return scored[0].item;
}


/* =========================================================
   CREATE NEW CURIOSITY
========================================================= */

function createNewCuriosity() {

    /*
       First use existing knowledge.
    */

    if (knowledgeGraph.length > 0) {

        const node =
            knowledgeGraph[
                Math.floor(
                    Math.random() *
                    knowledgeGraph.length
                )
            ];


        const questionTypes = [

            `Why is ${node.name} important?`,

            `How does ${node.name} work?`,

            `What is the history of ${node.name}?`,

            `What is connected to ${node.name}?`,

            `What happens because of ${node.name}?`

        ];


        addCuriosity(
            questionTypes[
                Math.floor(
                    Math.random() *
                    questionTypes.length
                )
            ],
            node.name
        );

        return;
    }


    /*
       If it knows absolutely nothing,
       start with a random subject.
    */

    const starterTopics = [

        "Space",

        "Earth",

        "Animals",

        "History",

        "Science",

        "Computers",

        "Ocean",

        "Dinosaurs",

        "Physics",

        "Plants"

    ];


    const topic =
        starterTopics[
            Math.floor(
                Math.random() *
                starterTopics.length
            )
        ];


    addCuriosity(
        `What is ${topic}?`,
        "starter"
    );
}


/* =========================================================
   STATISTICS
========================================================= */

function updateStats() {

    document.getElementById(
        "memoryCount"
    ).textContent =
        memory.length;


    let connections = 0;

    knowledgeGraph.forEach(
        node => {
            connections +=
                node.connections.length;
        }
    );


    document.getElementById(
        "connectionCount"
    ).textContent =
        connections;


    document.getElementById(
        "curiosityLevel"
    ).textContent =
        Math.round(
            brain.curiosity
        );


    document.getElementById(
        "energyLevel"
    ).textContent =
        Math.round(
            brain.energy
        );


    document.getElementById(
        "boredomLevel"
    ).textContent =
        Math.round(
            brain.boredom
        );


    document.getElementById(
        "focusLevel"
    ).textContent =
        Math.round(
            brain.focus
        );


    updateCuriosityUI();

}


/* =========================================================
   HELPER
========================================================= */

function shorten(text, length = 150) {

    if (text.length <= length)
        return text;

    return (
        text.substring(0, length) +
        "..."
    );
}


/* =========================================================
   USER CONTROLS
========================================================= */

document
.getElementById("goalButton")
.addEventListener("click", () => {

    setGoal(
        document
        .getElementById("goalInput")
        .value
    );

});


document
.getElementById("memoryButton")
.addEventListener("click", () => {

    const input =
        document
        .getElementById("memoryInput");

    if (!input.value.trim())
        return;

    saveMemory(
        input.value,
        {
            source: "user"
        }
    );

    input.value = "";

    think(
        "🧠 I will remember that."
    );

});


document
.getElementById("researchButton")
.addEventListener("click", async () => {

    const input =
        document
        .getElementById("researchInput");

    if (!input.value.trim())
        return;

    await research(
        input.value,
        false
    );

    input.value = "";

});


document
.getElementById("clearMemory")
.addEventListener("click", () => {

    if (
        !confirm(
            "Clear the AI's entire memory?"
        )
    )
        return;

    memory = [];
    researchHistory = [];
    curiosityQueue = [];
    knowledgeGraph = [];

    localStorage.removeItem(
        "littleAI_memory"
    );

    localStorage.removeItem(
        "littleAI_research"
    );

    localStorage.removeItem(
        "littleAI_curiosity"
    );

    localStorage.removeItem(
        "littleAI_graph"
    );

    think(
        "🧹 My memory has been cleared."
    );

    addLog(
        "Brain cleared."
    );

    updateStats();

});


/* =========================================================
   HIDE UI
========================================================= */

let uiHidden = false;

document
.getElementById("hideUI")
.addEventListener("click", () => {

    uiHidden = !uiHidden;

    document
        .querySelectorAll(".panel")
        .forEach(panel => {

            panel.classList.toggle(
                "hidden",
                uiHidden
            );

        });

    document.getElementById(
        "hideUI"
    ).textContent =
        uiHidden
        ? "Show UI"
        : "Hide UI";

});


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
.getElementById("brainPanel")
.addEventListener("click", () => {

    if (
        window.innerWidth <= 700
    ) {

        document
        .getElementById("controls")
        .classList.toggle(
            "mobileOpen"
        );

    }

});


/* =========================================================
   AUTONOMOUS STATE LOOP
========================================================= */

setInterval(() => {

    /*
       Curiosity naturally fluctuates.
    */

    if (Math.random() < .5) {

        brain.curiosity =
            Math.min(
                100,
                brain.curiosity + 1
            );

    }


    /*
       Focus falls slowly.
    */

    brain.focus =
        Math.max(
            0,
            brain.focus - .5
        );


    /*
       If energy is low, let it rest.
    */

    if (brain.energy < 15) {

        brain.mood =
            "resting";

        think(
            "😴 I need a little rest before I continue."
        );

        brain.energy =
            Math.min(
                100,
                brain.energy + 5
            );

    }


    saveBrainState();
    updateStats();

}, 5000);


/* =========================================================
   AUTONOMOUS RESEARCH TIMER
========================================================= */

/*
   Every 8 seconds the brain gets an opportunity
   to do something on its own.

   It doesn't necessarily research every time,
   because it may be resting or thinking.
*/

setInterval(() => {

    if (
        brain.energy >= 15 &&
        !researchRunning
    ) {

        autonomousBrainLoop();

    }

}, 8000);


/* =========================================================
   AUTONOMOUS THOUGHT TIMER
========================================================= */

setInterval(() => {

    if (researchRunning)
        return;


    const thoughts = [

        "I wonder what I should investigate next.",

        "There must be connections between the things I know.",

        "I wonder whether my knowledge is missing something important.",

        "Maybe I should follow one of my existing connections.",

        "I wonder what I would discover if I kept researching.",

        "There is probably something I haven't considered yet."

    ];


    const thought =
        thoughts[
            Math.floor(
                Math.random() *
                thoughts.length
            )
        ];


    think(
        "💭 " + thought
    );


}, 15000);


/* =========================================================
   AI MOVEMENT
========================================================= */

let targetX = 0;
let targetZ = 0;

function chooseMovementTarget() {

    targetX =
        (Math.random() * 7) - 3.5;

    targetZ =
        (Math.random() * 7) - 3.5;

}


chooseMovementTarget();

setInterval(
    chooseMovementTarget,
    5000
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();

function animate() {

    requestAnimationFrame(
        animate
    );

    const time =
        clock.getElapsedTime();


    /*
       Floating animation.
    */

    body.position.y =
        .65 +
        Math.sin(time * 2) * .08;


    /*
       Move AI around the island.
    */

    const dx =
        targetX -
        ai.position.x;

    const dz =
        targetZ -
        ai.position.z;

    const distance =
        Math.sqrt(
            dx * dx +
            dz * dz
        );


    if (distance > .15) {

        ai.position.x +=
            dx * .01;

        ai.position.z +=
            dz * .01;

        ai.rotation.y =
            Math.atan2(
                dx,
                dz
            );

    }


    /*
       Camera gently follows the AI.
    */

    camera.lookAt(
        ai.position.x,
        0,
        ai.position.z
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   STARTUP
========================================================= */

goalElement.textContent =
    goal;

updateStats();

addLog(
    "Brain loaded."
);

addLog(
    "Autonomous research is ON."
);

addLog(
    "Memory contains " +
    memory.length +
    " items."
);


think(
    "🌱 I am awake. I can research things on my own."
);


/*
   If the brain has no knowledge,
   give it a starting curiosity.

   Otherwise, immediately continue from
   its existing knowledge.
*/

if (
    curiosityQueue.length === 0
) {

    createNewCuriosity();

}


/*
   Start the first autonomous cycle
   after a short delay.
*/

setTimeout(() => {

    autonomousBrainLoop();

}, 3000);

</script>
